services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    shm_size: ${PG_SHM_SIZE:-256mb}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: astroswarm-server
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ${BACKUP_PATH:-./backups}:/app/backups

  server:
    image: astroswarm-server
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["serve"]
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      DB_POOL_SIZE: ${DB_POOL_SIZE:-16}
      CORS_ORIGINS: '["${FRONTEND_ORIGIN}"]'
      PORT: ${PORT:-5050}
      CLIENT_DIR: /app/client
      API_SECRET_KEY: ${API_SECRET_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "${SERVER_BIND_ADDRESS:-0.0.0.0}:${PORT:-5050}:${PORT:-5050}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads
      - ${BACKUP_PATH:-./backups}:/app/backups
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${PORT:-5050}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_URL: ${WORKER_SERVER_URL:-http://server:5050}
      API_SECRET_KEY: ${API_SECRET_KEY}
      WORKER_NAME: ${WORKER_NAME:-worker}
      WORKER_ID: ${WORKER_ID:-}
      # Evaluations run at once. Defaults to 4, or usable cores / CORES_PER_JOB when that is set.
      JOB_SLOTS: ${JOB_SLOTS:-}
      CORES_PER_JOB: ${CORES_PER_JOB:-}
      # Cores shared by every running evaluation. Defaults to the container's limit.
      WORKER_CORES: ${WORKER_CORES:-}
      # Cap on parallel matches inside one evaluation. Defaults to WORKER_CORES.
      SIM_WORKERS: ${SIM_WORKERS:-}
      # fixed reproduces the Godot benchmarker: one evader spawn for every ring
      # sweep run. varied stratifies the approach angle per trial and regrades
      # every entry, so only set it when you intend to re-simulate them all.
      EVAL_SWEEP_SPAWN: ${EVAL_SWEEP_SPAWN:-fixed}
      EVAL_TIMEOUT_SECONDS: ${EVAL_TIMEOUT_SECONDS:-1800}
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - worker_data:/data

volumes:
  pgdata:
  uploads:
  worker_data:
